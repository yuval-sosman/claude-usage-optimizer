<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code Usage</title>
<style>
/* ---- Color roles (dataviz reference palette; validated light + dark) ---- */
:root {
  color-scheme: light;
  --mode: light;
  --page: #f9f9f7;
  --surface-1: #fcfcfb;
  --wash: rgba(11, 11, 11, 0.045);
  --wash-strong: rgba(11, 11, 11, 0.09);
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --grid: #e1e0d9;
  --baseline: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --good-text: #006300;
  --shadow: 0 6px 24px rgba(11, 11, 11, 0.12);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --status-good: #0ca30c; --status-warning: #fab219; --status-serious: #ec835a; --status-critical: #d03b3b;
  --topbar-h: 58px;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --mode: dark;
    --page: #0d0d0d;
    --surface-1: #1a1a19;
    --wash: rgba(255, 255, 255, 0.06);
    --wash-strong: rgba(255, 255, 255, 0.12);
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --grid: #2c2c2a;
    --baseline: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --good-text: #0ca30c;
    --shadow: 0 6px 24px rgba(0, 0, 0, 0.55);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --mode: dark;
  --page: #0d0d0d;
  --surface-1: #1a1a19;
  --wash: rgba(255, 255, 255, 0.06);
  --wash-strong: rgba(255, 255, 255, 0.12);
  --text-primary: #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted: #898781;
  --grid: #2c2c2a;
  --baseline: #383835;
  --border: rgba(255, 255, 255, 0.10);
  --good-text: #0ca30c;
  --shadow: 0 6px 24px rgba(0, 0, 0, 0.55);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
}

/* ---- Page ---- */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-top: calc(var(--topbar-h) + 12px); }
body {
  margin: 0;
  background: var(--page);
  color: var(--text-primary);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, select { font: inherit; color: inherit; }
a { color: inherit; }

.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap;
  min-height: var(--topbar-h);
  padding: 10px max(24px, calc((100% - 1400px) / 2 + 24px));   /* same edges as .layout (max 1400px, centred) */
  background: var(--page);
  border-bottom: 1px solid var(--border);
}
.brand { min-width: 0; }
.brand h1 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.25; }
.brand .range { font-size: 12px; color: var(--text-secondary); }
.controls { margin-left: auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.ctl { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-secondary); }
.ctl select {
  font-size: 13px; color: var(--text-primary);
  background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
  padding: 6px 28px 6px 10px; max-width: 360px;
}
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface-1); }
.seg button {
  border: 0; background: transparent; padding: 6px 10px; font-size: 12px; color: var(--text-secondary); cursor: pointer;
}
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--wash-strong); color: var(--text-primary); font-weight: 600; }
.seg button:hover { background: var(--wash); }
.menu-btn {
  display: none; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-1);
  padding: 6px 10px; font-size: 12px; cursor: pointer;
}

.layout {
  display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: 28px;
  max-width: 1400px; margin: 0 auto; padding: 16px 24px 72px;
}
.toc {
  position: sticky; top: calc(var(--topbar-h) + 12px); align-self: start;
  max-height: calc(100vh - var(--topbar-h) - 24px); overflow: auto;
  font-size: 13px; padding-right: 4px;
}
.toc .toc-h { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin: 4px 0 8px; }
.toc a.sec-link { display: block; padding: 5px 8px; border-radius: 6px; text-decoration: none; color: var(--text-secondary); }
.toc a.sec-link:hover { background: var(--wash); color: var(--text-primary); }
.toc a.sec-link.active { background: var(--wash-strong); color: var(--text-primary); font-weight: 600; }
.toc .chips { display: flex; flex-wrap: wrap; gap: 3px; padding: 2px 8px 8px; }
.toc .chips a {
  font-size: 10.5px; text-decoration: none; color: var(--text-muted);
  border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; font-variant-numeric: tabular-nums;
}
.toc .chips a:hover { color: var(--text-primary); background: var(--wash); }
main { min-width: 0; }

/* ---- Headline ---- */
.headline { margin: 4px 0 8px; }
.hero { padding: 8px 0 4px; }
.hero .l { font-size: 13px; color: var(--text-secondary); }
.hero .v { font-size: 56px; font-weight: 600; line-height: 1.05; letter-spacing: -0.02em; margin: 2px 0; }
.hero .s { font-size: 13px; color: var(--text-muted); }
.ins { list-style: none; margin: 16px 0 0; padding: 0; background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; }
.ins li { display: flex; gap: 12px; align-items: flex-start; padding: 11px 16px; border-top: 1px solid var(--grid); }
.ins li:first-child { border-top: 0; }
.ins .txt { flex: 1; min-width: 0; }
.ins .go {
  flex-shrink: 0; font-size: 11px; color: var(--text-secondary); text-decoration: none;
  border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; font-variant-numeric: tabular-nums;
}
.ins .go:hover { background: var(--wash); color: var(--text-primary); }
.st { display: inline-flex; align-items: center; gap: 6px; min-width: 66px; font-size: 11px; color: var(--text-secondary); padding-top: 1px; }
.st i {
  width: 16px; height: 16px; border-radius: 50%; display: inline-grid; place-items: center;
  font-style: normal; font-size: 10px; font-weight: 700; line-height: 1;
}
.st-good i { background: var(--status-good); color: #ffffff; }
.st-warn i { background: var(--status-warning); color: #0b0b0b; }
.st-info i { background: var(--wash-strong); color: var(--text-primary); }

/* ---- Sections & cards ---- */
.sec > h2 { font-size: 20px; font-weight: 600; margin: 36px 0 12px; scroll-margin-top: calc(var(--topbar-h) + 12px); }
.card {
  background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
  padding: 18px 20px 20px; margin: 0 0 16px; scroll-margin-top: calc(var(--topbar-h) + 12px);
}
.card-head { display: flex; gap: 10px; align-items: flex-start; }
.badge {
  flex-shrink: 0; font-size: 11px; font-weight: 600; line-height: 1; padding: 5px 7px; margin-top: 1px;
  border-radius: 6px; background: var(--wash-strong); color: var(--text-secondary); font-variant-numeric: tabular-nums;
}
.card h3 { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.35; flex: 1; min-width: 0; }
.pills { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; flex-shrink: 0; max-width: 40%; }
.pill { font-size: 10.5px; padding: 1px 7px; border: 1px solid var(--border); border-radius: 999px; color: var(--text-secondary); white-space: nowrap; }
.why { color: var(--text-secondary); font-size: 13px; margin: 6px 0 0; }
.card-body { min-height: 0; }
.blk { margin-top: 16px; }
.row2, .rowN { display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); gap: 0; }
.rowN > * { padding: 0 20px; }
.rowN > :first-child { padding-left: 0; }
.rowN > :last-child { padding-right: 0; }
.rowN > * + * { border-left: 1px solid var(--baseline); }
.rowN > .blk { display: flex; flex-direction: column; }
.rowN > .blk > figure.chart { flex: 1; display: flex; flex-direction: column; }
.rowN > .blk > figure.chart > .svgwrap, .rowN > .blk > figure.chart > .scroll-shell { margin-top: auto; }   /* side-by-side charts share a baseline */
.rowN.mix { grid-template-columns: var(--tpl); }                  /* a chart beside a table: the table gets more room */
.rowN.mix > .blk > figure.chart > .svgwrap, .rowN.mix > .blk > figure.chart > .scroll-shell { margin-top: 6px; }   /* ...and the chart stays at the top */
.rowN.mix .t td { overflow-wrap: break-word; }                    /* whole words only, so a narrow column isn't split mid-word */
.blk-text { margin: 0; color: var(--text-primary); font-size: 13.5px; }
.blk-list h4, .tbl-title { margin: 0 0 6px; font-size: 13px; font-weight: 600; }
.blk-list ul { margin: 0; padding-left: 18px; font-size: 13px; }
.blk-list li { margin: 2px 0; overflow-wrap: anywhere; }
.callout {
  margin-top: 16px; padding: 10px 14px; border-radius: 8px;
  background: var(--wash); border-left: 3px solid var(--text-secondary); font-size: 13.5px;
}
.callout .lab { display: block; font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px; }
.callout p { margin: 2px 0; }
.note { font-size: 12px; color: var(--text-muted); margin-top: 12px; }
.empty { margin-top: 14px; padding: 18px; border: 1px dashed var(--baseline); border-radius: 10px; color: var(--text-muted); font-size: 13px; }
.err { margin-top: 14px; padding: 10px 14px; border-radius: 8px; background: var(--wash); border-left: 3px solid var(--status-critical); font-size: 12.5px; }

/* ---- KPI tiles ---- */
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 12px; }
.kpis.sym { grid-template-columns: repeat(var(--kcols, 3), minmax(0, 1fr)); }
@media (max-width: 720px) { .kpis.sym { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-1); min-width: 0; }
.kpi .l { font-size: 12px; color: var(--text-secondary); }
.kpi .v { font-size: 24px; font-weight: 600; margin-top: 3px; letter-spacing: -0.01em; line-height: 1.2; overflow-wrap: anywhere; }
.kpi .s, .kpi .r { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
.kpi .s { white-space: pre-line; }
.kpi .dual { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 2px 18px; margin-top: 3px; }
.kpi .dual .v { margin-top: 0; }
.kpi .dual .mo .v { font-size: 18px; color: var(--text-secondary); }
.kpi .cap { font-size: 11px; color: var(--text-muted); letter-spacing: 0.01em; }
.headline .kpis { margin-top: 14px; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.headline .kpi { display: flex; flex-direction: column; }
.headline .kpi .v { margin-top: auto; padding-top: 6px; }
@media (max-width: 720px) { .headline .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* ---- Charts ---- */
figure.chart { margin: 0; }
.chart-head { display: flex; align-items: baseline; gap: 10px; min-height: 22px; }
.chart-title { font-size: 13px; font-weight: 600; flex: 1; min-width: 0; }
.tbl-toggle, .more {
  flex-shrink: 0; font-size: 11.5px; color: var(--text-secondary); background: transparent;
  border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; cursor: pointer;
}
.tbl-toggle:hover, .more:hover { background: var(--wash); color: var(--text-primary); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--text-secondary); margin: 6px 0 2px; }
.legend:empty { display: none; }
.lg-item { display: inline-flex; align-items: center; gap: 6px; }
.sw { display: inline-block; flex-shrink: 0; }
.sw.rect { width: 10px; height: 10px; border-radius: 2px; }
.sw.line { width: 14px; height: 2px; border-radius: 1px; }
.sw.dot { width: 8px; height: 8px; border-radius: 50%; }
.b1 { background: var(--s1); } .b2 { background: var(--s2); } .b3 { background: var(--s3); } .b4 { background: var(--s4); }
.b5 { background: var(--s5); } .b6 { background: var(--s6); } .b7 { background: var(--s7); } .b8 { background: var(--s8); }
.b0 { background: var(--text-primary); }   /* slot 0: neutral ink for a total drawn with its parts */
.svgwrap { width: 100%; position: relative; margin-top: 6px; }
.svgwrap svg { display: block; overflow: visible; }
.svgwrap.scroll-x { overflow-x: auto; overflow-y: hidden; padding-bottom: 10px; scrollbar-width: thin; scrollbar-color: var(--baseline) transparent; }
.svgwrap.scroll-x::-webkit-scrollbar { height: 8px; }
.svgwrap.scroll-x::-webkit-scrollbar-thumb { background: var(--baseline); border-radius: 4px; }
.svgwrap.scroll-x::-webkit-scrollbar-track { background: var(--wash); border-radius: 4px; }
.scroll-shell { position: relative; }
.scroll-shell::before, .scroll-shell::after { content: ""; position: absolute; top: 0; bottom: 18px; width: 36px; pointer-events: none; opacity: 0; transition: opacity 0.15s; z-index: 1; }
.scroll-shell::before { left: 0; background: linear-gradient(90deg, var(--surface-1), transparent); }
.scroll-shell::after { right: 0; background: linear-gradient(270deg, var(--surface-1), transparent); }
.scroll-shell.can-l::before, .scroll-shell.can-r::after { opacity: 1; }
.scroll-btn { position: absolute; top: calc(50% - 24px); z-index: 2; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border);
  background: var(--surface-1); color: var(--text-primary); box-shadow: var(--shadow); cursor: pointer; font-size: 15px; line-height: 1; display: none; padding: 0; }
.scroll-btn.l { left: 2px; } .scroll-btn.r { right: 2px; }
.scroll-shell.can-l .scroll-btn.l, .scroll-shell.can-r .scroll-btn.r { display: inline-flex; align-items: center; justify-content: center; }
.scroll-btn:hover { background: var(--wash-strong); }
.scroll-hint { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
.svgwrap.scroll-x svg { overflow: hidden; }
.tabsblk { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.tb-head { width: 100%; display: flex; align-items: baseline; gap: 10px; padding: 11px 14px; background: var(--wash); border: 0; cursor: pointer;
  text-align: left; color: var(--text-primary); font: inherit; }
.tb-head:hover { background: var(--wash-strong); }
.tb-title { font-weight: 600; font-size: 13px; white-space: nowrap; }
.tb-sub { font-size: 12px; color: var(--text-muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tb-chev { color: var(--text-secondary); transition: transform 0.15s ease; }
.tabsblk.open .tb-chev { transform: rotate(180deg); }
.tb-body { padding: 12px 14px 14px; border-top: 1px solid var(--border); }
.tb-body[hidden] { display: none !important; }
.tb-seg { margin-bottom: 10px; }
.tb-desc { font-size: 13px; color: var(--text-secondary); margin: 0 0 12px; line-height: 1.5; max-width: 900px; }
.tb-seg button { font-size: 12.5px; padding: 5px 12px; }
.tb-panel .blk { margin: 0; }
.pie-sl { stroke: var(--surface-1); stroke-width: 2; stroke-linejoin: round; }
.pie-v { font-size: 20px; font-weight: 700; fill: var(--text-primary); font-variant-numeric: tabular-nums; }
.pie-l { font-size: 11.5px; fill: var(--text-muted); }
figure.as-table .svgwrap, figure.as-table .legend, figure.as-table .scroll-shell, figure.as-table .scroll-hint { display: none; }
figure:not(.as-table) .chart-tbl { display: none; }
.chart-cap { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
svg text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
.ax { fill: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.axt { fill: var(--text-secondary); font-size: 11px; }
.cat { fill: var(--text-secondary); font-size: 12px; }
.vl { fill: var(--text-secondary); font-size: 11px; font-variant-numeric: tabular-nums; }
.ref-l { fill: var(--text-muted); font-size: 11px; }
.gridl { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
.basel { stroke: var(--baseline); stroke-width: 1; shape-rendering: crispEdges; }
.refl { stroke: var(--text-muted); stroke-width: 1; shape-rendering: crispEdges; }
.xh { stroke: var(--text-muted); stroke-width: 1; shape-rendering: crispEdges; pointer-events: none; }
.f1 { fill: var(--s1); } .f2 { fill: var(--s2); } .f3 { fill: var(--s3); } .f4 { fill: var(--s4); }
.f5 { fill: var(--s5); } .f6 { fill: var(--s6); } .f7 { fill: var(--s7); } .f8 { fill: var(--s8); }
.k1 { stroke: var(--s1); } .k2 { stroke: var(--s2); } .k3 { stroke: var(--s3); } .k4 { stroke: var(--s4); }
.k5 { stroke: var(--s5); } .k6 { stroke: var(--s6); } .k7 { stroke: var(--s7); } .k8 { stroke: var(--s8); }
.k0 { stroke: var(--text-primary); } .f0 { fill: var(--text-primary); } .ln.k0 { stroke-width: 2.5; }
.ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.area { stroke: none; opacity: 0.10; }
.dotm { stroke: var(--surface-1); stroke-width: 2; }
.mark { transition: filter 0.12s ease; }
.mark.hl { filter: brightness(1.14) saturate(1.1); }
.hit { fill: transparent; outline: none; }
.hit:focus-visible { stroke: var(--text-primary); stroke-width: 1; }
.cellm:focus-visible { stroke: var(--text-primary); stroke-width: 1.5; outline: none; }

/* ---- Tooltip ---- */
.tt {
  position: fixed; z-index: 60; pointer-events: none; left: 0; top: 0;
  background: var(--surface-1); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow);
  padding: 8px 10px; font-size: 12px; max-width: 340px;
}
.tt[hidden] { display: none; }
.tt-title { color: var(--text-secondary); margin-bottom: 4px; overflow-wrap: anywhere; }
.tt-row { display: flex; align-items: center; gap: 8px; line-height: 1.6; }
.tt-row.cur .tt-name { color: var(--text-primary); }
.tt-key { width: 12px; height: 3px; border-radius: 2px; flex-shrink: 0; }
.tt-val { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tt-name { color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---- Cache-miss traces ---- */
.trx-list { display: grid; gap: 6px; }
.trx-item {
  display: grid; grid-template-columns: 22px 62px minmax(0, 1fr) auto auto;
  grid-template-areas: "rank usd main idle rw"; gap: 2px 14px; align-items: center;
  width: 100%; text-align: left; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 12px; cursor: pointer;
}
.trx-item:hover { background: var(--wash); }
.trx-item[aria-selected="true"] { background: var(--wash-strong); border-color: var(--text-muted); }
.trx-item:focus-visible { outline: 2px solid var(--s1); outline-offset: 1px; }
.trx-rank { grid-area: rank; font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.trx-usd { grid-area: usd; font-weight: 600; font-variant-numeric: tabular-nums; }
.trx-main { grid-area: main; min-width: 0; display: flex; flex-direction: column; }
.trx-cause { font-size: 13px; font-weight: 600; }
.trx-where { font-size: 12px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trx-idle { grid-area: idle; }
.trx-rw { grid-area: rw; }
.trx-idle, .trx-rw { font-size: 12px; color: var(--text-secondary); white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
.trx-list .trx-item.extra { display: none; }
.trx-list.all .trx-item.extra { display: grid; }
.trx-detail { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--grid); }
.trx-title { margin: 0; font-size: 15px; font-weight: 600; }
.trx-sub { font-size: 12.5px; color: var(--text-secondary); margin-top: 3px; overflow-wrap: anywhere; }
.trx-detail .kpis { margin-top: 12px; }
.trx-story { margin: 14px 0 0; padding-left: 20px; font-size: 13.5px; }
.trx-story li { margin: 4px 0; }
.trx-detail figure.chart { margin-top: 18px; }
.callout ul { margin: 4px 0 0; padding-left: 18px; }
.callout li { margin: 3px 0; }
.tr-band { fill: var(--wash); }
.tr-hatch-bg { fill: var(--surface-1); }
.tr-hatch { stroke: var(--baseline); stroke-width: 2; }
.tr-brk { opacity: 0.9; pointer-events: none; }
.tr-brk-l { fill: var(--text-secondary); font-weight: 600; }

    var el = (tr.state === 'alive' ? 'Cache still alive until ' : 'Cache expired ') + clkRef(mk.expiry, tz, ref) + (tr.state === 'waiting' ? ', while the request waited' : '');
    var ew = textW(el, 11.5), ax = Math.max(4, Math.min(W - ew - 4, ex - ew / 2));

    bindHit(eh, function () {

      text: truncate('The cache was still alive: it would have expired at ' + clkRef(mk.expiry, tz, ref), W - px0, 11) }, svg);
  }

    var bl = fmtDur(tr.idle) + ' from the previous reply to the next request';
    if (textW(bl, 11.5) > W - px0 - 8) bl = fmtDur(tr.idle) + ' idle';
    var bw = textW(bl, 11.5), bcx = (bx0 + bx1) / 2, blx = Math.max(px0, Math.min(W - bw - 6, bcx - bw / 2));

  var free = function (k, a, b) { return (occ[k] || []).every(function (iv) { return b < iv[0] - 4 || a > iv[1] + 4; }); };
  var place = function (d, texts) {
    var k = d.ln.id + ':' + d.it.row;
    for (var i = 0; i < texts.length; i++) {
      var w = textW(texts[i], 11.5), a = d.it.b + 6, b = a + w;
      if (b <= px1 && free(k, a, b)) { sv('text', { class: 'tr-ann', x: a, y: d.cy, 'dominant-baseline': 'central', text: texts[i] }, svg); (occ[k] = occ[k] || []).push([a, b]); return; }
      b = d.it.a - 6; a = b - w;
      if (a >= px0 && free(k, a, b)) { sv('text', { class: 'tr-ann', x: b, y: d.cy, 'dominant-baseline': 'central', 'text-anchor': 'end', text: texts[i] }, svg); (occ[k] = occ[k] || []).push([a, b]); return; }

      for (var j = 0; j < texts.length; j++) {
        if (textW(texts[j], 11.5) + 16 <= d.it.b - d.it.a) { sv('text', { class: 'tr-ann', x: d.it.a + 8, y: d.cy, 'dominant-baseline': 'central', text: texts[j] }, svg); return; }

  var want = [];
  drawn.forEach(function (d) {
    var e = d.e;
    if (e.tag === 'miss') want.push([0, d, ['Cache miss · ' + fmt(e.rw, 'tokens') + ' re-written · ' + fmt(e.xusd, 'usd'), 'Cache miss · ' + fmt(e.xusd, 'usd'), 'Miss']]);

  });

  TR_LEGEND.forEach(function (l) { if (seen[l[0]]) legend.push({ name: l[1], sw: l[2] }); });

  if (sc.breaks.length) legend.push({ name: 'Squeezed quiet time', sw: 'hatch' });

}

function traceTable(tr) {

             dur: isNum(e.e) && e.e > e.t ? fmtDur(isNum(e.dur) ? e.dur : (e.e - e.t) / 1000) : '', det: evDetail(e) };

                     { key: 'what', label: 'Event' }, { key: 'dur', label: 'Duration', align: 'r' }, { key: 'det', label: 'Details' }], rows, 0);

function renderOverview(wrap, tr, pick, listed) {

  var sx = sc.sx, top = 8, plotH = 96, y0 = top + plotH, H = y0 + 24;

  var svg = newSvg(wrap, W, H, 'Context size over the session, with every cache miss');
  var hatch = hatchDefs(svg);
  dom.ticks.forEach(function (t) {
    var Y = Math.round(sy(t)) + 0.5;

    sv('text', { class: 'ax', x: x0 - 8, y: Y, 'text-anchor': 'end', 'dominant-baseline': 'central', text: fmt(t, 'tokens', 'axis') }, svg);
  });

  }
  sc.breaks.forEach(function (g) { sv('rect', { x: g.x0 + 1, y: top, width: Math.max(1, g.w - 2), height: plotH, fill: hatch, class: 'tr-brk' }, svg); });
  lines.forEach(function (L) {

    L.pts.forEach(function (p, i) { var X = sx(p[0]).toFixed(1), Y = sy(p[1]).toFixed(1); d += i ? 'H' + X + 'V' + Y : 'M' + X + ',' + Y; });
    sv('path', { d: d, class: 'ln k' + L.slot }, svg);
  });
  prompts.forEach(function (t) { var X = Math.round(sx(t)) + 0.5; sv('line', { x1: X, x2: X, y1: y0 - 8, y2: y0, class: 'tr-ptick' }, svg); });
  sv('line', { class: 'basel', x1: x0, x2: x1, y1: y0 + 0.5, y2: y0 + 0.5 }, svg);
  var lastR = -Infinity, lastDay = null;

    var a = Math.max(x0, tk.x - w / 2);

  if (misses.length) legend.push({ name: 'Cache miss (ringed: this one)', sw: 'dot bcrit' });

}
function overviewTable(tr) {

function figShell(title, draw, table, note) {
  var fig = h('figure', { class: 'chart' });
  var head = h('div', { class: 'chart-head' });
  head.append(h('figcaption', { class: 'chart-title', text: title }));
  var btn = h('button', { type: 'button', class: 'tbl-toggle', 'aria-pressed': 'false', text: 'Table' });
  head.append(btn);
  var lg = h('div', { class: 'legend' }), wrap = h('div', { class: 'svgwrap' }), tblBox = h('div', { class: 'chart-tbl' });
  fig.append(head, lg, wrap, tblBox);
  if (note) fig.append(h('div', { class: 'chart-cap', text: note }));
  var lastW = 0;
  function redraw(force) {
    if (fig.classList.contains('as-table')) return;
    var w = Math.floor(wrap.clientWidth);
    if (!force && w === lastW && wrap.firstChild) return;
    lastW = w;
    var items = draw(wrap) || [];
    lg.replaceChildren.apply(lg, items.map(function (it) { return h('span', { class: 'lg-item' }, h('span', { class: 'sw ' + it.sw }), it.name); }));
  }
  btn.addEventListener('click', function () {
    var on = !fig.classList.contains('as-table');
    fig.classList.toggle('as-table', on);
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    btn.textContent = on ? 'Chart' : 'Table';
    if (on && !tblBox.firstChild) tblBox.append(table());
    if (!on) redraw(true);

}

function traceDetail(tr, pick, listed) {
  var tz = tr.tz || 0, mk = tr.marks || {}, nodes = [];
  var head = h('div', { class: 'trx-head' });
  head.append(h('h4', { class: 'trx-title', text: tr.cause + ' · ' + fmt(tr.usd, 'usd') + ' extra' }));
  head.append(h('div', { class: 'trx-sub', text: [DAY_LONG.format(tzd(tr.at, tz)) + ', ' + clk(tr.at, tz), tr.session, tr.thread, tr.model, tr.project].filter(Boolean).join(' · ') }));
  nodes.push(head);
  var pr = tr.price || {};
  var k = h('div', { class: 'kpis' });
  k.append(kpiTile({ label: 'Extra cost', value: tr.usd, unit: 'usd',
    sub: isNum(pr.write) ? fmt(tr.rw, 'tokens') + ' × (' + fmt(pr.write, 'usd') + ' write − ' + fmt(pr.read, 'usd') + ' read) per M' : null }));
  k.append(kpiTile({ label: 'Re-written', value: tr.rw, unit: 'tokens', sub: 'of ' + fmt(tr.ctx, 'tokens') + ' in context; ' + fmt(tr.cr || 0, 'tokens') + ' still read' }));
  k.append(kpiTile({ label: 'Idle before it', value: tr.idle, unit: 'sec', sub: 'previous reply → next request' }));
  k.append(kpiTile({ label: 'Cache lifetime', value: tr.ttl, unit: 'sec',
    sub: tr.state === 'alive' ? 'still alive, ' + fmtDur((mk.expiry - mk.start) / 1000) + ' left' :
         tr.state === 'waiting' ? 'expired while the request waited for the API' : 'expired ' + fmtDur((mk.start - mk.expiry) / 1000) + ' before the request' }));
  if (tr.wait >= 30) k.append(kpiTile({ label: 'Wait for the answer', value: tr.wait, unit: 'sec', sub: 'request → first token' }));
  nodes.push(k);
  var ol = h('ol', { class: 'trx-story', 'aria-label': 'What happened' });
  (tr.story || []).forEach(function (s) { ol.append(h('li', { text: s })); });
  nodes.push(ol);
  nodes.push(figShell('Timeline: from the previous reply to the miss', function (wrap) { return renderTrace(wrap, tr); }, function () { return traceTable(tr); },
    'Time runs left to right. Hatched stretches are quiet time drawn narrow; their real length is printed above them. Hover any mark for details.'));
  if ((tr.advice || []).length) {
    var co = h('div', { class: 'callout' }, h('span', { class: 'lab', text: 'What could have been better' }));
    var ul = h('ul');

    co.append(ul);

    '. Click another miss to trace it.' + (others ? ' ' + others + ' more miss' + (others > 1 ? 'es' : '') + ' happened in other subagents of this session.' : '')));

  if (secEls[sec.id]) return secEls[sec.id];
  var el = h('section', { class: 'sec', id: 'sec-' + sec.id, 'data-sec': sec.id });
  var h2 = h('h2', { text: sec.title || sec.id });
  var cards = h('div', { class: 'cards' });
  el.append(h2, cards);
  sectionsEl.append(el);
  return (secEls[sec.id] = { el: el, h2: h2, cards: cards });
}
function ensureCard(id) {
  if (cardEls[id]) return cardEls[id];
  var el = h('article', { class: 'card', id: 'card-' + id, 'data-id': id });
  var head = h('div');
  var body = h('div', { class: 'card-body' });
  el.append(head, body);
  var ce = { id: id, el: el, head: head, body: body, dirty: true, card: null };
  if (io) io.observe(el);
  return (cardEls[id] = ce);
}
function renderCardHead(ce) {
  var card = ce.card || {};
  var row = h('div', { class: 'card-head' });
  row.append(h('span', { class: 'badge', text: ce.id }));
  row.append(h('h3', { text: card.q || card.title || ce.id }));
  var tags = String(card.scope || '').split(/[\s,]+/).filter(Boolean);
  if (tags.length) {
    var pills = h('div', { class: 'pills', 'aria-label': 'Scopes' });
    tags.forEach(function (t) { pills.append(h('span', { class: 'pill', title: 'Computed ' + (SCOPE_WORDS[t] ? 'per ' + SCOPE_WORDS[t] : t), text: SCOPE_WORDS[t] || t })); });
    row.append(pills);
  }
  var nodes = [row];
  if (card.why) nodes.push(h('p', { class: 'why', text: card.why }));
  ce.head.replaceChildren.apply(ce.head, nodes);
}
function renderCardBody(ce) {
  var card = ce.card || {};
  ce.dirty = false;
  ce.body.style.minHeight = '';
  var out = [];
  try {
    if (card.empty) {
      out.push(h('div', { class: 'empty', text: 'No data in this scope: ' + card.empty }));
    } else {
      var blocks = card.blocks || [];
      blocks = blocks.filter(function (x) { return x && !x.hidden; });     // hidden blocks are kept in the data for the digest only
      for (var i = 0; i < blocks.length; i++) {
        var b = blocks[i];
        var per = b && b.width === 'half' ? 2 : b && b.width === 'third' ? 3 : 1, run = 1;
        while (per > 1 && run < per && blocks[i + run] && blocks[i + run].width === b.width) run++;
        if (run > 1) {                                 // side-by-side blocks share a row, with dividers
          var grp = blocks.slice(i, i + run), mix = grp.some(function (x) { return x.kind === 'table'; }) && grp.some(function (x) { return x.kind === 'chart'; });
          var row = h('div', { class: 'rowN' + (mix ? ' mix' : ''), style: '--cols:' + run });
          if (mix) row.style.setProperty('--tpl', grp.map(function (x) { return 'minmax(0, ' + (x.kind === 'table' ? 3 : 2) + 'fr)'; }).join(' '));
          for (var j = 0; j < run; j++) row.append(blockEl(grp[j]));
          out.push(row);
          i += run - 1;
        } else if (b) out.push(blockEl(b));
      }
    }
    var ins = [];
    if (card.insight) ins.push(card.insight);
    (card.insights || []).forEach(function (t) { if (t) ins.push(t); });
    if (ins.length) {
      var co = h('div', { class: 'callout' }, h('span', { class: 'lab', text: ins.length > 1 ? 'Insights' : 'Insight' }));
      ins.forEach(function (t) { co.append(h('p', { text: t })); });
      out.push(co);
    }
    if (card.note) out.push(h('div', { class: 'note', text: card.note }));
  } catch (e) {
    renderErrors++;
    document.body.setAttribute('data-render-errors', String(renderErrors));
    out = [h('div', { class: 'err', text: 'This card could not be rendered: ' + (e && e.message ? e.message : e) })];
    if (window.console) console.error(e);
  }
  ce.body.replaceChildren.apply(ce.body, out);
  ce.body.querySelectorAll('figure.chart').forEach(function (f) {
    try { f._draw(true); }
    catch (e) {
      renderErrors++;
      document.body.setAttribute('data-render-errors', String(renderErrors));
      f.append(h('div', { class: 'err', text: 'Chart failed: ' + (e && e.message ? e.message : e) }));
      if (window.console) console.error(e);
    }
  });
}
function nearViewport(el) { var r = el.getBoundingClientRect(); return r.bottom > -900 && r.top < innerHeight + 900; }
function findAnchor() {
  var topLimit = document.getElementById('topbar').getBoundingClientRect().bottom;
  var list = sectionsEl.querySelectorAll('.card:not([hidden])');
  for (var i = 0; i < list.length; i++) { var r = list[i].getBoundingClientRect(); if (r.bottom > topLimit) return { el: list[i], top: r.top }; }
  return null;
}
function renderScope() {
  var only = state.tab === 'report' && state.filter ? state.filter.ids : null;
  var anchor = window.scrollY > 40 && !only ? findAnchor() : null;
  var cards = scopeData().cards || {};
  sectionList().forEach(function (sec) {
    var se = ensureSection(sec);
    var ids = Object.keys(cards).filter(function (id) { return sectionOf(id) === sec.id && !cards[id].hidden && (!only || only.indexOf(id) >= 0); }).sort(byId);
    Array.prototype.forEach.call(se.cards.children, function (el) { el.hidden = true; });
    ids.forEach(function (id) {
      var ce = ensureCard(id);
      ce.card = cards[id];
      ce.el.hidden = false;
      renderCardHead(ce);
      ce.dirty = true;
      ce.body.replaceChildren();
      ce.body.style.minHeight = estimateHeight(ce.card) + 'px';
      se.cards.append(ce.el);
    });
    se.el.hidden = ids.length === 0;
  });
  Object.keys(cardEls).forEach(function (id) {
    var ce = cardEls[id];
    if (!ce.el.hidden && (state.renderAll || only || nearViewport(ce.el))) renderCardBody(ce);
  });
  if (anchor && anchor.el.isConnected && !anchor.el.hidden) {
    var delta = anchor.el.getBoundingClientRect().top - anchor.top;
    if (Math.abs(delta) > 1) window.scrollBy(0, delta);
  }
  renderFilterbar();
  renderHeadline();
  renderToc();
}
function renderAll() { Object.keys(cardEls).forEach(function (id) { var ce = cardEls[id]; if (!ce.el.hidden && ce.dirty) renderCardBody(ce); }); }
function redrawCharts(force) {
  document.querySelectorAll('figure.chart').forEach(function (f) { if (f._draw && f.isConnected) { try { f._draw(force); } catch (e) { if (window.console) console.error(e); } } });
}
function scrollToCard(id) {
  var ce = cardEls[id];
  if (!ce || ce.el.hidden) return;
  if (ce.dirty) renderCardBody(ce);
  ce.el.scrollIntoView({ block: 'start' });
  setTimeout(function () { if (ce.dirty) renderCardBody(ce); ce.el.scrollIntoView({ block: 'start' }); }, 140);
  tocEl.classList.remove('open');
  document.getElementById('menuBtn').setAttribute('aria-expanded', 'false');
}

/* ---- headline ---- */
var STATUS = { good: ['st-good', '✓', 'Good'], warn: ['st-warn', '!', 'Watch'], info: ['st-info', 'i', 'Note'] };
function renderHeadline() {
  var hd = scopeData().headline;
  if (!hd || (state.tab === 'report' && state.filter)) { headlineEl.replaceChildren(); headlineEl.hidden = true; return; }
  headlineEl.hidden = false;
  var nodes = [];
  if (hd.hero) {
    var hero = h('div', { class: 'hero' });
    hero.append(h('div', { class: 'l', text: hd.hero.label || '' }));
    hero.append(h('div', { class: 'v', text: fmt(hd.hero.value, hd.hero.unit, 'label') }));
    if (hd.hero.sub) hero.append(h('div', { class: 's', text: hd.hero.sub }));
    nodes.push(hero);
  }
  if ((hd.kpis || []).length) {
    var g = h('div', { class: 'kpis' });
    hd.kpis.forEach(function (k) { g.append(kpiTile(k)); });
    nodes.push(g);
  }
  headlineEl.replaceChildren.apply(headlineEl, nodes);
}

/* ---- table of contents ---- */
function renderToc() {
  var cards = scopeData().cards || {};
  var only = state.tab === 'report' && state.filter ? state.filter.ids : null;
  if (only) { var kept = {}; only.forEach(function (id) { if (cards[id]) kept[id] = cards[id]; }); cards = kept; }
  var nodes = [h('div', { class: 'toc-h', text: only ? 'Filtered' : 'Contents' })];
  if (scopeData().headline && !only) {
    var top = h('a', { class: 'sec-link', href: '#headline', text: 'Headline' });
    top.addEventListener('click', function (e) { e.preventDefault(); window.scrollTo(0, 0); tocEl.classList.remove('open'); });
    nodes.push(top);
  }
  sectionList().forEach(function (sec) {
    var ids = Object.keys(cards).filter(function (id) { return sectionOf(id) === sec.id && !cards[id].hidden; }).sort(byId);
    if (!ids.length) return;
    var a = h('a', { class: 'sec-link', href: '#sec-' + sec.id, 'data-sec': sec.id, text: sec.title || sec.id });
    a.addEventListener('click', function (e) {
      e.preventDefault();
      var se = secEls[sec.id];
      if (se) { se.el.scrollIntoView({ block: 'start' }); setTimeout(function () { se.el.scrollIntoView({ block: 'start' }); }, 140); }
      tocEl.classList.remove('open');
    });
    nodes.push(a);
    var chips = h('div', { class: 'chips' });
    ids.forEach(function (id) {
      var c = h('a', { href: '#card-' + id, title: (cards[id] && cards[id].q) || id, text: id });
      c.addEventListener('click', function (e) { e.preventDefault(); scrollToCard(id); });
      chips.append(c);
    });
    nodes.push(chips);
  });
  tocEl.replaceChildren.apply(tocEl, nodes);
  markActiveSection();
}
function markActiveSection() {
  var topLimit = document.getElementById('topbar').getBoundingClientRect().bottom + 20;
  var active = null;
  Object.keys(secEls).forEach(function (id) {
    var se = secEls[id];
    if (se.el.hidden) return;
    var r = se.el.getBoundingClientRect();
    if (r.top <= topLimit + 40 && r.bottom > topLimit) active = id;
  });
  tocEl.querySelectorAll('a.sec-link[data-sec]').forEach(function (a) { a.classList.toggle('active', a.getAttribute('data-sec') === active); });
}

/* ---- scope selector & hash ---- */
function hashParams() { try { return new URLSearchParams(location.hash.replace(/^#/, '')); } catch (e) { return new URLSearchParams(); } }
function validScope(id) { return !!(id && (REPORT.data || {})[id]); }
function setHashScope(id) {
  var p = hashParams();
  p.set('scope', id);
  var s = p.toString();
  try { history.replaceState(null, '', '#' + s); } catch (e) { location.hash = s; }
}
function buildScopeSelect() {
  var sel = document.getElementById('scope');
  sel.replaceChildren();
  (REPORT.scopes || []).forEach(function (s) {
    if (!(REPORT.data || {})[s.id]) return;
    var pre = s.kind === 'dir' ? '    ' : s.kind === 'group' ? '  ' : '';
    sel.append(h('option', { value: s.id, text: pre + (s.label || s.id) }));
  });
  sel.value = state.scope;
  sel.addEventListener('change', function () {
    state.scope = sel.value;
    setHashScope(state.scope);
    hideTip();
    renderScope();
  });
}

/* ---- theme ---- */
var themeMode = 'auto';
function applyTheme(mode, persist) {
  themeMode = mode === 'light' || mode === 'dark' ? mode : 'auto';
  if (themeMode === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', themeMode);
  if (persist) { try { localStorage.setItem('ccu-theme', themeMode); } catch (e) { /* storage unavailable */ } }
  document.querySelectorAll('#theme button').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-mode') === themeMode ? 'true' : 'false'); });
  redrawCharts(true);
}

/* ---- init ---- */
function init() {
  var meta = REPORT.meta || {};
  document.getElementById('title').textContent = meta.title || 'Claude Code usage';
  if (meta.title) document.title = meta.title;
  var rangeTxt = [];
  if (meta.range && (meta.range.start || meta.range.end)) rangeTxt.push(fmtDate(meta.range.start, false) + ' – ' + (parseDate(meta.range.end) != null ? DATE_MDY.format(new Date(parseDate(meta.range.end))) : String(meta.range.end)));
  if (meta.subtitle) rangeTxt.push(meta.subtitle);
  document.getElementById('range').textContent = rangeTxt.join(' · ');

  var p = hashParams();
  var first = (REPORT.scopes || []).filter(function (s) { return validScope(s.id); })[0];
  state.scope = validScope(p.get('scope')) ? p.get('scope') : (first ? first.id : Object.keys(REPORT.data || {})[0]);
  state.renderAll = p.get('render') === 'all';

  var stored = null;
  try { stored = localStorage.getItem('ccu-theme'); } catch (e) { stored = null; }
  var forced = p.get('theme');
  applyTheme(forced || stored || 'auto', false);
  document.querySelectorAll('#theme button').forEach(function (b) {
    b.addEventListener('click', function () { applyTheme(b.getAttribute('data-mode'), true); });
  });
  try {
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { if (themeMode === 'auto') redrawCharts(true); });
  } catch (e) { /* old browsers */ }

  if ('IntersectionObserver' in window) {
    io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        var ce = cardEls[en.target.getAttribute('data-id')];
        if (ce && ce.dirty && !ce.el.hidden) renderCardBody(ce);
      });
    }, { rootMargin: '900px 0px' });
  } else state.renderAll = true;

  readHash();
  buildScopeSelect();
  renderScope();
  showView();
  if (state.tab !== 'report' && state.focus) setTimeout(function () { focusItem(state.tab, state.focus); }, 80);

  var foot = document.getElementById('foot');
  var fn = [];
  if (meta.generated) fn.push(h('div', { text: 'Generated ' + meta.generated }));
  if ((meta.notes || []).length) { var ul = h('ul'); meta.notes.forEach(function (t) { ul.append(h('li', { text: t })); }); fn.push(ul); }
  foot.replaceChildren.apply(foot, fn);

  var menuBtn = document.getElementById('menuBtn');
  menuBtn.addEventListener('click', function () {
    var open = !tocEl.classList.contains('open');
    tocEl.classList.toggle('open', open);
    menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  var rt = null;
  window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { redrawCharts(false); }, 150); });
  var st = null;
  window.addEventListener('scroll', function () { if (st) return; st = setTimeout(function () { st = null; markActiveSection(); }, 100); }, { passive: true });
  window.addEventListener('beforeprint', renderAll);
  function syncFromHash() {
    var q = hashParams(), sc = q.get('scope');
    var was = state.tab + '|' + (state.filter ? state.filter.ids.join(',') : '');
    readHash();
    var scopeChanged = validScope(sc) && sc !== state.scope;
    if (scopeChanged) { state.scope = sc; document.getElementById('scope').value = sc; }
    showView();
    if (state.tab === 'report' && (scopeChanged || was !== state.tab + '|' + (state.filter ? state.filter.ids.join(',') : ''))) renderScope();
    if (state.tab !== 'report' && state.focus) focusItem(state.tab, state.focus);
    var th = q.get('theme');
    if (th && th !== themeMode) applyTheme(th, false);
  }
  window.addEventListener('hashchange', syncFromHash);
  window.addEventListener('popstate', syncFromHash);
  var go = p.get('goto');
  if (go) scrollToCard(go);
  document.body.setAttribute('data-render-status', 'ok');
  document.body.setAttribute('data-render-errors', String(renderErrors));
}

/* =====================================================================
   Built-in demo (used only when no data was injected)

              { name: 'Cache read', slot: 1, values: days.map(function (_, i) { return wave(i, 8, 20) * scale; }) },

              rows: [{ s: 'Implement the plan with 2 subagents', c: 73, t: 21000000 }, { s: 'Home usage card', c: 40.2, t: 12000000 }, { s: 'Fix worktree slug', c: 22.6, t: 7000000 }, { s: 'Review findings', c: 9.1, t: 2100000 }] }

              points: [{ x: 31606552, y: 1054, g: 1, label: 'a186d0ac' }, { x: 3097794, y: 5618, g: 1, label: 'a3065b6e' }, { x: 420000, y: 900, g: 0, label: 'explore-1' }, { x: 120000, y: 2100, g: 2, label: 'plan-1' }] } },
            { kind: 'chart', chart: { type: 'heatmap', title: 'Prompts by weekday and hour', unit: 'count', valueName: 'prompts', rows: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'], cols: Array.apply(null, Array(24)).map(function (_, i) { return String(i).padStart(2, '0'); }), values: heat } }
          ]

  return {

    scopes: [{ id: 'all', label: 'All projects', kind: 'all' }, { id: 'g:demo', label: 'demo-project', kind: 'group' }],

}

try { init(); }
catch (e) {
  document.body.setAttribute('data-render-status', 'error');
  var box = h('div', { class: 'fatal' });
  box.append(h('strong', { text: 'The report failed to render. ' }), document.createTextNode(e && e.message ? e.message : String(e)));
  document.body.prepend(box);
  if (window.console) console.error(e);
}
window.addEventListener('error', function () { document.body.setAttribute('data-render-status', 'error'); });
})();
