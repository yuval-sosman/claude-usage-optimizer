<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<style>
/*__FONTS__*/
/* The claude-usage video: a fixed 1080 x 1080 frame in the report's dark palette, drawn from window.VIDEO (filled in by
   video.py). One timeline: render(t) sets every element for time t, so the page plays by itself and video_capture.py can
   draw any frame exactly (?record, window.__seek). No network: the fonts are embedded. */
:root {
  color-scheme: dark;
  --void: #050505; --bg: #0c0c0b; --panel: #151514; --panel-2: #1f1f1d; --term: #10100f;
  --line: rgba(255, 255, 255, 0.08); --line-2: rgba(255, 255, 255, 0.16);
  --text: #efeee9; --text-2: #bab9b1; --text-3: #87867f;
  --blue: #3d8ae3; --blue-soft: rgba(61, 138, 227, 0.42); --orange: #eb6834; --teal: #1baf7a; --amber: #e0a000;
  --pink: #e87ba4; --violet: #8b7ee8; --green: #5cb56a; --red: #e34948; --red-text: #f08a89; --red-soft: rgba(227, 73, 72, 0.38);
  --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--void); color: var(--text); font-family: var(--ui); -webkit-font-smoothing: antialiased; overflow: hidden; }

/* player */
#viewport { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding-block: 16px; padding-inline: 16px; }
#frame { position: relative; flex: none; width: 540px; height: 540px; overflow: hidden; border-radius: 14px; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.07), 0 30px 80px rgba(0, 0, 0, 0.6); }
#stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1080px; transform-origin: 0 0; background: var(--bg); overflow: hidden; }
#stage::before { content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image: linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px); background-size: 100% 54px; background-position: 0 26px;
  -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 42%, #000 20%, transparent 90%); mask-image: radial-gradient(ellipse 80% 70% at 50% 42%, #000 20%, transparent 90%); }
#controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; font: 500 13px/1.2 var(--ui); color: var(--text-2); }
#controls button { font: 500 13px/1 var(--ui); color: var(--text); background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 6px; padding: 8px 12px; cursor: pointer; }
#controls button:hover { background: #2a2a27; }
#controls button:focus-visible, #scrub:focus-visible, #bigplay:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
#scrub { flex: 1 1 140px; min-width: 0; accent-color: var(--blue); }
#time { font: 500 13px/1 var(--mono); font-variant-numeric: tabular-nums; }
#hint { flex-basis: 100%; margin: 0; font: 400 12px/1.4 var(--ui); color: var(--text-3); }
#bigplay { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 5; font: 600 16px/1 var(--ui); color: #0c0c0b; background: var(--text); border: 0; border-radius: 999px; padding: 16px 28px; cursor: pointer; }
html.bare #controls { display: none; }
html.record #viewport { padding: 0; }
html.record #frame { border-radius: 0; box-shadow: none; }
html.record #controls, html.record #bigplay { display: none; }

/* scenes */
.scene { position: absolute; inset: 0; padding: 128px 72px 64px; display: flex; flex-direction: column; justify-content: center; gap: 40px; visibility: hidden; opacity: 0; }
.layer { padding: 0; pointer-events: none; }
.topbar { position: absolute; top: 48px; left: 72px; right: 72px; display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 14px; font: 600 24px/1 var(--mono); letter-spacing: -0.01em; }
.mark { width: 34px; height: 34px; flex: none; display: block; }
.mark .m1 { fill: var(--blue); } .mark .m2 { fill: var(--orange); } .mark .m3 { fill: var(--green); }
.pill { font: 500 18px/1 var(--mono); color: var(--text-3); border: 1px solid var(--line-2); border-radius: 999px; padding: 9px 16px; }
.cap { display: flex; flex-direction: column; gap: 18px; }
.eyebrow { display: flex; align-items: center; gap: 12px; font: 500 22px/1.2 var(--mono); color: var(--text-2); letter-spacing: 0.02em; }
.dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--c, var(--blue)); flex: none; }
h1, h2, h3, p { margin: 0; }
h2 { font: 700 68px/1.03 var(--display); letter-spacing: -0.028em; text-wrap: balance; }
h2.long { font-size: 58px; }
.w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: 0.12em; margin-bottom: -0.12em; }
.w > span { display: inline-block; }
.panel { background: var(--panel); border: 1px solid var(--line-2); border-radius: 14px; }
.plabel { font: 500 19px/1 var(--mono); color: var(--text-3); letter-spacing: 0.02em; }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.clamp1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.num { font-variant-numeric: tabular-nums; }

/* intro */
.s-intro { gap: 0; }
.hook { font: 760 96px/1 var(--display); letter-spacing: -0.035em; text-wrap: balance; margin-top: 20px; }
.hook-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 36px; margin-top: 56px; }
.big { margin-top: 12px; font: 800 180px/0.9 var(--display); letter-spacing: -0.045em; white-space: nowrap; }
.spark-cap { font: 500 19px/1.2 var(--mono); color: var(--text-3); text-align: right; }
.hook-sub { margin-top: 44px; font: 500 30px/1.3 var(--ui); color: var(--text-2); }
.sp-line { fill: none; stroke: var(--blue); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
.sp-area { fill: rgba(61, 138, 227, 0.14); }
.sp-peak { fill: var(--blue); stroke: var(--bg); stroke-width: 3; }

/* numbers */
.tiles { display: grid; background: var(--panel); border: 1px solid var(--line-2); border-radius: 14px; overflow: hidden; }
.tile { padding: 24px 22px 26px; min-width: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.tile.er { border-right: 0; } .tile.eb { border-bottom: 0; }
.tile span { display: block; font: 400 20px/1.25 var(--ui); color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile b { display: block; margin-top: 12px; font: 600 50px/1 var(--ui); letter-spacing: -0.01em; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* models */
.mpanel { padding: 28px 32px 30px; display: flex; flex-direction: column; gap: 18px; }
.mrow { display: grid; grid-template-columns: 180px 1fr 210px; align-items: center; gap: 18px; }
.mrow .ml { font: 500 24px/1.2 var(--ui); }
.mtrack { height: 20px; border-radius: 5px; background: var(--panel-2); overflow: hidden; }
.mtrack i, .ltrack i { display: block; height: 100%; width: 0; border-radius: 5px; background: var(--c, var(--blue)); }
.mv { font: 600 24px/1 var(--ui); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mv small { font: 400 20px/1 var(--ui); color: var(--text-3); margin-left: 6px; }
.stack { display: flex; height: 28px; border-radius: 6px; overflow: hidden; background: var(--panel-2); }
.stack i { flex: none; height: 100%; width: 0; background: var(--c); }
.legend { display: flex; flex-wrap: wrap; gap: 10px 24px; font: 400 20px/1.2 var(--ui); color: var(--text-2); }
.legend span { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.legend i { width: 12px; height: 12px; border-radius: 3px; background: var(--c); }
.divider { height: 1px; background: var(--line); margin: 6px 0; }

/* miss */
.trace { padding: 26px 32px 28px; display: flex; flex-direction: column; gap: 20px; }
.tr-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; }
.tr-title { font: 600 30px/1.2 var(--ui); }
.tr-meta { margin-top: 6px; font: 400 20px/1.3 var(--ui); color: var(--text-3); }
.tr-cost { font: 700 46px/1 var(--ui); color: var(--red-text); font-variant-numeric: tabular-nums; white-space: nowrap; }
.axis { position: relative; height: 30px; margin-left: 110px; font: 500 18px/30px var(--mono); color: var(--text-3); }
.axis span { position: absolute; top: 0; white-space: nowrap; }
.lanes { position: relative; display: grid; grid-template-rows: repeat(3, 52px); margin-bottom: 40px; border-bottom: 1px solid var(--line); }
.lane { display: flex; align-items: center; font: 500 20px/1 var(--ui); color: var(--text-2); border-top: 1px solid var(--line); }
.lane:nth-child(2) { background: rgba(255, 255, 255, 0.025); }
.track { position: absolute; left: 110px; right: 0; top: 0; bottom: 0; }
.bar { position: absolute; height: 26px; width: 0; border-radius: 5px; overflow: hidden; }
.bar span { position: absolute; left: 12px; top: 0; font: 500 17px/26px var(--ui); white-space: nowrap; }
.bar.prev { top: 65px; background: var(--blue-soft); }
.bar.prev::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 18px; background: var(--blue); }
.bar.prev span { color: #dde8f6; }
.bar.cache { top: 117px; background: rgba(27, 175, 122, 0.3); }
.bar.cache span { color: #bfe9d6; }
.bar.miss { top: 65px; background: linear-gradient(90deg, var(--red-soft), var(--red)); }
.idle { position: absolute; top: 0; bottom: 0; width: 0; border-inline: 1px dashed rgba(255, 255, 255, 0.28);
  background: repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.13) 0 2px, transparent 2px 9px); }
.expiry { position: absolute; top: -4px; bottom: -28px; border-left: 2px dashed var(--red); }
.expiry span { position: absolute; top: 100%; left: 0; transform: translate(-50%, 4px); white-space: nowrap; font: 500 18px/1 var(--mono); color: var(--red-text); }
.you { position: absolute; top: 0; left: 0; height: 52px; display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
.you span { font: 500 19px/1 var(--ui); background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 6px; padding: 7px 10px; white-space: nowrap; }
.you i { width: 14px; height: 14px; border-radius: 50%; background: var(--orange); flex: none; margin-right: -7px; }
.rw-lbl { position: absolute; right: 0; top: 104px; height: 52px; display: flex; align-items: center; font: 600 19px/1 var(--ui); color: var(--red-text); white-space: nowrap; }
.mstrip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.mstrip div span { display: block; font: 400 19px/1.2 var(--ui); color: var(--text-3); }
.mstrip div b { display: block; margin-top: 8px; font: 600 34px/1 var(--ui); font-variant-numeric: tabular-nums; }
.tip { display: flex; gap: 16px; align-items: flex-start; background: rgba(61, 138, 227, 0.09); border: 1px solid rgba(61, 138, 227, 0.24); border-radius: 10px; padding: 16px 22px; }
.tip svg { width: 26px; height: 26px; flex: none; margin-top: 2px; fill: none; stroke: var(--blue); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tip b { display: block; font: 600 21px/1.3 var(--ui); }
.tip p { margin-top: 4px; font: 400 21px/1.4 var(--ui); color: var(--text-2); }

/* insights */
.cards { display: flex; flex-direction: column; gap: 16px; }
.icard { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: start; padding: 22px 28px 24px; }
.ic-meta { display: flex; align-items: center; gap: 10px; font: 500 19px/1 var(--ui); color: var(--text-3); }
.icard h3 { margin: 12px 0 0; font: 600 29px/1.22 var(--ui); }
.fix { margin-top: 14px; display: flex; align-items: center; gap: 12px; min-width: 0; font: 400 19px/1 var(--ui); color: var(--text-3); }
.fix span { color: var(--text); border: 1px solid var(--line-2); border-radius: 6px; padding: 8px 12px; min-width: 0; }
.ic-save { text-align: right; padding-top: 4px; }
.amt { font: 600 46px/1 var(--ui); color: var(--green); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; white-space: nowrap; }
.basis { margin-top: 10px; font: 400 19px/1.3 var(--ui); color: var(--text-3); white-space: nowrap; }

/* levers */
.lpanel { padding: 28px 32px 28px; display: flex; flex-direction: column; gap: 22px; }
.lrow .ll { font: 500 24px/1.25 var(--ui); }
.lline { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center; margin-top: 10px; }
.ltrack { height: 18px; }
.lv { font: 600 26px/1 var(--ui); color: var(--green); font-variant-numeric: tabular-nums; white-space: nowrap; }
.lv small { font: 400 19px/1 var(--ui); color: var(--text-3); margin-left: 8px; }
.pnote { font: 400 18px/1.4 var(--ui); color: var(--text-3); }

/* optimizations */
.oprog { display: flex; align-items: center; gap: 18px; font: 500 22px/1 var(--ui); color: var(--text-2); white-space: nowrap; }
.oprog .ob { flex: 1; height: 10px; border-radius: 99px; background: var(--panel-2); overflow: hidden; }
.oprog .ob i { display: block; height: 100%; width: 0; background: var(--green); }
.orows { display: flex; flex-direction: column; gap: 14px; }
.orow { display: grid; grid-template-columns: 32px 1fr auto; gap: 20px; align-items: center; padding: 20px 26px; }
.ocheck { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line-2); display: grid; place-items: center; }
.ocheck.on { background: var(--green); border-color: var(--green); }
.ocheck svg { width: 18px; height: 18px; fill: none; stroke: #0c0c0b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.okind { display: inline-flex; align-items: center; font: 500 18px/1 var(--ui); color: var(--text-2); border: 1px solid var(--line-2); border-radius: 999px; padding: 6px 12px; }
.okind.done { color: var(--green); border-color: rgba(92, 181, 106, 0.5); margin-left: 8px; }
.otitle { margin-top: 10px; font: 600 26px/1.22 var(--ui); }
.osave { text-align: right; }
.osave b { display: block; font: 600 38px/1 var(--ui); color: var(--green); font-variant-numeric: tabular-nums; white-space: nowrap; }
.osave span { display: block; margin-top: 8px; font: 400 18px/1 var(--ui); color: var(--text-3); white-space: nowrap; }

/* savings */
.s-save { gap: 0; }
.pay-num { margin-top: 18px; font: 800 240px/0.88 var(--display); letter-spacing: -0.045em; color: var(--green); white-space: nowrap; }
.pay-of { margin-top: 20px; font: 500 30px/1.35 var(--ui); color: var(--text-2); }
.pay-bar { margin-top: 34px; height: 30px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--line-2); overflow: hidden; }
.pay-bar i { display: block; height: 100%; width: 0; background: var(--green); }
.pay-legend { margin-top: 12px; display: flex; justify-content: space-between; font: 500 19px/1 var(--mono); color: var(--text-3); }
.pay-legend b { color: var(--green); font-weight: 600; }
.pay-applied { margin-top: 36px; display: flex; align-items: center; gap: 14px; font: 500 26px/1.3 var(--ui); }
.pay-applied .ocheck { flex: none; }

/* last scene */
.credit { margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; font: 400 18px/1.4 var(--ui); color: var(--text-3); }
.credit b { font: 600 20px/1.2 var(--mono); color: var(--text-2); }
</style>
</head>
<body>
<div id="viewport">
  <div id="frame">
    <div id="stage" role="img" aria-label="An animated summary of Claude Code usage"></div>
    <button id="bigplay" type="button" hidden>▶ Play</button>
  </div>
  <div id="controls" role="group" aria-label="Playback">
    <button id="play" type="button">Pause</button>
    <button id="restart" type="button">Restart</button>
    <input id="scrub" type="range" min="0" max="60" step="0.01" value="0" aria-label="Position in the video">
    <span id="time">0:00</span>
    <p id="hint">Space plays or pauses · R restarts · H hides these controls</p>
  </div>
</div>
<script>
window.VIDEO = /*__VIDEO_DATA__*/null;
(() => {
  const V = window.VIDEO;
  const root = document.documentElement;
  const rec = /(^|[?&#])record\b/.test(location.search + location.hash);
  if (rec) root.classList.add('record');
  let reduce = false;
  try { reduce = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { /* older browsers */ }
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const eOut = x => 1 - Math.pow(1 - x, 3);
  const eIO = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

  const FMT = {
    usd: v => v == null ? '–' : (Math.abs(v) >= 100 ? '$' + Math.round(v).toLocaleString('en-US') : '$' + v.toFixed(2)),
    pct: v => v == null ? '–' : (v > 0 && v < 0.1 ? '<0.1%' : v.toFixed(1) + '%'),
    count: v => v == null ? '–' : Math.round(v).toLocaleString('en-US'),
    tokens: v => {
      if (v == null) return '–';
      for (const [d, s] of [[1e9, 'B'], [1e6, 'M'], [1e3, 'K']]) if (Math.abs(v) >= d) { const x = v / d; return (x < 100 ? x.toFixed(1) : x.toFixed(0)) + s; }
      return String(Math.round(v));
    },
    hours: v => v == null ? '–' : Math.round(v).toLocaleString('en-US') + ' h',
    ratio: v => v == null ? '–' : Math.round(v) + '×',
  };
  const fmt = (v, u) => (FMT[u] || FMT.count)(v);

  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v; else e.setAttribute(k, v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
    return e;
  }
  const svg = (markup, cls) => { const s = h('span', { class: cls || '' }); s.innerHTML = markup; return s.firstChild; };   // static drawings only, never text
  const MARK = '<svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect class="m1" x="3" y="3" width="7" height="26" rx="2"/><rect class="m2" x="12.5" y="11" width="7" height="18" rx="2"/><rect class="m3" x="22" y="19" width="7" height="10" rx="2"/></svg>';
  const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const BULB = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>';
  const SERIES = ['var(--blue)', 'var(--orange)', 'var(--teal)', 'var(--amber)', 'var(--pink)', 'var(--violet)'];
  const PRIO = { high: ['var(--red)', 'High priority'], medium: ['var(--amber)', 'Medium priority'], low: ['var(--blue)', 'Low priority'] };
  const count = (v, unit, at, dur, pre) => ({ 'data-count': v, 'data-fmt': unit, 'data-cin': at, 'data-cdur': dur || 1.0, 'data-pre': pre || null });

  function caption(sc, A, color) {
    return h('header', { class: 'cap' },
      h('div', { class: 'eyebrow', 'data-in': A(0.2) }, h('i', { class: 'dot', style: '--c:' + color }), sc.eyebrow),
      h('h2', { class: sc.headline.length > 44 ? 'long' : null, 'data-words': A(0.3), 'data-step': 0.04 }, sc.headline));
  }

  // ---------- scene builders: each returns the scene's content; A(x) = the absolute time x seconds into the scene ----------
  const BUILD = {
    intro(sc, A, first) {
      const s = sc.spark || [], w = 440, hgt = 150, pad = 9, n = s.length;
      const mx = Math.max(1e-9, ...s);
      const pts = s.map((v, i) => [pad + (n > 1 ? i / (n - 1) : 0.5) * (w - 2 * pad), hgt - pad - v / mx * (hgt - 2 * pad)]);
      const line = pts.length ? 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L') : '';
      const area = pts.length ? `${line} L${pts[n - 1][0].toFixed(1)} ${hgt - pad} L${pts[0][0].toFixed(1)} ${hgt - pad} Z` : '';
      const pk = sc.peak && pts[sc.peak.i];
      const spark = n > 1 ? svg(`<svg width="${w}" height="${hgt}" viewBox="0 0 ${w} ${hgt}" aria-hidden="true"><path class="sp-area" d="${area}"/>` +
        `<path class="sp-line" pathLength="1" d="${line}"/>${pk ? `<circle class="sp-peak" r="7" cx="${pk[0].toFixed(1)}" cy="${pk[1].toFixed(1)}"/>` : ''}</svg>`) : null;
      if (spark) {
        spark.querySelector('.sp-area').setAttribute('data-in', A(1.3)); spark.querySelector('.sp-area').setAttribute('data-fx', 'fade');
        const ln = spark.querySelector('.sp-line'); ln.setAttribute('data-draw', ''); ln.setAttribute('data-din', A(0.45)); ln.setAttribute('data-ddur', 1.05);
        const c = spark.querySelector('.sp-peak'); if (c) { c.setAttribute('data-in', A(1.5)); c.setAttribute('data-fx', 'fade'); }
      }
      const big = fmt(sc.value, 'usd'), len = sc.headline.length;
      return h('section', { class: 'scene s-intro' },
        h('div', { class: 'eyebrow', 'data-in': first ? '-1' : A(0.2) }, h('i', { class: 'dot', style: '--c:var(--blue)' }), sc.eyebrow),
